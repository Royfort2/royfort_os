<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vorschau: Bettwäsche · View all (Mobile Menü)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;1,9..40,400&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/theme.css">
  <style>
    :root,
    body.color-scheme-1 {
      --color-background: 255, 255, 255;
      --color-foreground: 23, 23, 23;
      --color-border: 237, 237, 237;
      --font-body-family: 'DM Sans', sans-serif;
      --font-body-weight: 400;
      --font-body-style: normal;
      --font-heading-family: 'Playfair Display', serif;
      --font-heading-weight: 400;
      --font-heading-style: normal;
      --font-heading-transform: uppercase;
      --font-h4-size: 1.6rem;
      --font-h5-size: 1.4rem;
      --font-navigation-family: var(--font-heading-family);
      --font-navigation-weight: var(--font-heading-weight);
      --font-navigation-style: var(--font-heading-style);
      --font-navigation-transform: var(--font-heading-transform);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100dvh;
      font-family: var(--font-body-family);
      color: rgb(var(--color-foreground));
      background: #8a8a8a url('https://images.unsplash.com/photo-1616594039964-ae9021a400a0?w=800&q=60') center/cover no-repeat;
    }

    .preview-banner {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      padding: 0.6rem 1rem;
      font-size: 0.75rem;
      text-align: center;
      background: #2e3192;
      color: #fff;
    }

    .preview-frame {
      position: fixed;
      top: 2.5rem;
      left: 50%;
      transform: translateX(-50%);
      width: min(100%, 430px);
      height: calc(100dvh - 2.5rem);
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.35);
      overflow: hidden;
    }

    .preview-frame menu-drawer {
      display: block;
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .preview-frame menu-drawer[hidden] {
      display: block;
    }

    .preview-frame .drawer__inner {
      --translate-x: 0;
      max-width: 100%;
    }

    .preview-frame .menu-drawer details.active > .menu-drawer__submenu {
      inset-inline-start: 0;
    }

    .preview-logo {
      font-family: var(--font-heading-family);
      font-size: 2rem;
      letter-spacing: 0.02em;
      color: #2e3192;
      text-decoration: none;
      text-transform: uppercase;
    }

    .icon-caret-preview {
      width: 1.2rem;
      height: 1.2rem;
      flex-shrink: 0;
    }

    .icon-caret-preview--small {
      width: 1rem;
      height: 1rem;
      transform: rotate(180deg);
    }
  </style>
</head>
<body class="color-scheme-1">
  <p class="preview-banner">Lokale Optik-Vorschau · nicht deployed · nur Menü-Ausschnitt Bettwäsche</p>

  <div class="preview-frame">
    <menu-drawer id="MenuDrawer" class="menu-drawer drawer drawer--left" active open>
      <div class="fixed-overlay" aria-hidden="true"></div>
      <div class="drawer__inner flex flex-col w-full h-full overflow-hidden">
        <div class="drawer__header menu-drawer__header flex items-center justify-between">
          <a href="#" class="preview-logo">Royfort</a>
          <button type="button" class="drawer__close btn btn--inherit" aria-label="Schließen">✕</button>
        </div>
        <div class="drawer__content menu-drawer__content flex-grow flex flex-col h-full w-full">
          <nav class="overflow-hidden flex-grow" role="navigation">
            <ul class="menu-drawer__menus v-scrollable relative w-full h-full active" data-parent>
              <li class="menu-drawer__item">
                <details class="active open" open>
                  <summary class="menu-drawer__item-link flex items-center justify-between" style="display:none">
                    <span>Bettwäsche</span>
                  </summary>
                  <div class="menu-drawer__submenu absolute z-1 flex flex-col w-full h-full" data-parent>
                    <button type="button" class="menu-drawer__item-back-link font-navigation flex items-center gap-2 w-full">
                      <svg class="icon-caret-preview icon-caret-preview--small" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <path d="M9.75 4.5L6 8.25L2.25 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                      </svg>
                      Bettwäsche
                    </button>
                    <ul class="flex flex-col h-full v-scrollable" data-parent role="list">
                      <li class="menu-drawer__item menu-drawer__item--view-all">
                        <a
                          href="/collections/hotelbettwaesche"
                          class="menu-drawer__item-link menu-drawer__item-link--view-all flex items-center justify-between"
                        >
                          Alle ansehen
                        </a>
                      </li>
                      <li class="menu-drawer__item" level="child">
                        <a href="#" class="menu-drawer__item-link flex items-center justify-between">
                          Material
                          <svg class="icon-caret-preview" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                            <path d="M9.75 4.5L6 8.25L2.25 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                          </svg>
                        </a>
                      </li>
                      <li class="menu-drawer__item" level="child">
                        <a href="#" class="menu-drawer__item-link flex items-center justify-between">
                          Kategorie
                          <svg class="icon-caret-preview" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                            <path d="M9.75 4.5L6 8.25L2.25 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                          </svg>
                        </a>
                      </li>
                    </ul>
                  </div>
                </details>
              </li>
            </ul>
          </nav>
          <div class="drawer__footer menu-drawer__footer flex justify-center flex-col gap-y-5">
            <div class="grid gap-3">
              <div class="menu-drawer__footer-menu">
                <ul class="menu-drawer__footer-menu-list">
                  <li class="menu-drawer__item menu-drawer__footer-menu-item">
                    <a href="#" class="menu-drawer__item-link menu-drawer__footer-menu-link">Standorte</a>
                  </li>
                  <li class="menu-drawer__item menu-drawer__footer-menu-item">
                    <a href="#" class="menu-drawer__item-link menu-drawer__footer-menu-link">Kontakt</a>
                  </li>
                  <li class="menu-drawer__item menu-drawer__footer-menu-item">
                    <a href="#" class="menu-drawer__item-link menu-drawer__footer-menu-link">Anmeldung</a>
                  </li>
                </ul>
              </div>
            </div>
          </div>
        </div>
      </div>
    </menu-drawer>
  </div>
</body>
</html>
